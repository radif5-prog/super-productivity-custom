<nav
  class="mobile-bottom-nav"
  [class.entrance]="isEntrance()"
>

  @if (slot(); as slot) {
    <!-- Tap navigates; long-press or contextmenu (right click, menu key) picks
         the destination. The anchor only positions the menu; its
         matButtonIcon/iconPositionEnd attributes project it into the button
         itself rather than the zero-width label. -->
    <button
      #slotButton
      mat-button
      class="nav-button e2e-bottom-nav-slot"
      [class.tour-planner]="slot.id === 'planner'"
      [class.active]="isSlotActive()"
      [attr.aria-label]="slot.kind === 'route' ? (slot.labelKey | translate) : slot.label"
      [attr.aria-description]="T.BN.SLOT_CHANGE_HINT | translate"
      (pointerdown)="onSlotPointerDown()"
      (longPress)="onSlotLongPress()"
      (touchend)="onSlotTouchEnd($event)"
      (contextmenu)="$event.preventDefault(); openSlotMenu()"
      (click)="onSlotClick(slot)"
    >
      @if (slot.kind === 'route') {
        <mat-icon>{{ slot.icon }}</mat-icon>
        <span class="nav-label">{{ slot.labelKey | translate }}</span>
      } @else {
        <plugin-icon
          [pluginId]="slot.pluginId"
          [fallbackIcon]="slot.icon"
        ></plugin-icon>
        <span class="nav-label">{{ slot.label }}</span>
      }
      <span
        class="slot-menu-anchor"
        matButtonIcon
        iconPositionEnd
        aria-hidden="true"
        #slotMenuTrigger="matMenuTrigger"
        [matMenuTriggerFor]="slotMenu"
        [matMenuTriggerRestoreFocus]="false"
        (menuClosed)="onSlotMenuClosed()"
      ></span>
    </button>
  }

  <button
    mat-fab
    class="add-task-button"
    [class.smaller]="hasProjectBacklog()"
    color="primary"
    (click)="showAddTaskBar()"
    [attr.aria-label]="T.GCF.KEYBOARD.GLOBAL_ADD_TASK | translate"
  >
    <mat-icon>add</mat-icon>
  </button>
</nav>

<mat-menu
  #slotMenu="matMenu"
  yPosition="above"
  class="mobile-bottom-nav-slot-menu"
  [ariaLabel]="T.BN.SLOT_MENU_LABEL | translate"
>
  @for (option of slotOptions(); track option.id) {
    <button
      mat-menu-item
      role="menuitemradio"
      [attr.aria-checked]="option.id === slot()?.id"
      (click)="selectSlot(option.id)"
    >
      @if (option.kind === 'route') {
        <mat-icon>{{ option.icon }}</mat-icon>
        <span>{{ option.labelKey | translate }}</span>
      } @else {
        <plugin-icon
          matMenuItemIcon
          [pluginId]="option.pluginId"
          [fallbackIcon]="option.icon"
        ></plugin-icon>
        <span>{{ option.label }}</span>
      }
      @if (option.id === slot()?.id) {
        <div><mat-icon>check</mat-icon></div>
      }
    </button>
  }
</mat-menu>
